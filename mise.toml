# Tools and machine setup. Keep this checkout at ~/dotfiles.
min_version = "2026.10.18"

[tools]
"aqua:neovim" = "v0.12.2"
ripgrep = "14.1.1"
tmux = "3.6a"
uv = "0.11.6"
#poetry = "1.6.1"
#kubectl = "1.32.2"
#argo = "3.5.6"
#aws-cli = "2.7.30"
#stern = "1.32.0"
#kubie = "latest"
#"npm:aws-azure-login" = "3.6.4"
#azure = "2.81.0"
lazygit = "0.61.1"
fd = "latest"
node = "24.0.0"
cosign = "latest"
sops = "3.10.2"
python = "3.13.3"
pipx = { version = "1.8.0", depends = ["python"] }
"npm:tree-sitter-cli" = { version = "latest", depends = ["node"] }
"aqua:docker/cli" = "29.2.0"
"aqua:docker/compose" = "5.0.2"
jq = "1.8.1"
rust = "1.95"
herdr = "0.7.5"
yq = "4.53.2"

[bootstrap.packages]
"apt:xclip" = { os = "linux" }
"apt:unzip" = { os = "linux" }
"apt:libasound2t64" = { os = "linux" }
"apt:libnss3" = { os = "linux" }
"apt:libxss1" = { os = "linux" }
"apt:libgbm-dev" = { os = "linux" }
"apt:build-essential" = { os = "linux" }

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.mise_shell_activate]
bash = true

[dotfiles]
"~/.tmux.conf" = "~/dotfiles/tmux.conf"

"~/.config/nvim/init.lua" = "~/dotfiles/nvim/init.lua"
"~/.config/nvim/lua" = "~/dotfiles/nvim/lua"
"~/.config/nvim/lazy-lock.json" = "~/dotfiles/nvim/lazy-lock.json"

"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"

"~/.git-templates/hooks/commit-msg" = {
    source = "~/dotfiles/git/commit-msg",
    mode = "copy",
    permissions = "0755"
}

[tasks.bootstrap]
description = "Create the projects directory and configure Git's template directory"
run = 'bash "$HOME/dotfiles/scripts/bootstrap.sh"'

[settings]
idiomatic_version_file_enable_tools = ["python"]
self_update.auto = true
